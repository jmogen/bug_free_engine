<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
    <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <span class="terminal-title">Terminal Portfolio</span>
            <span class="terminal-buttons">
                <span class="button minimize">_</span>
                <span class="button maximize">□</span>
                <span class="button close">✕</span>
            </span>
        </div>
        <div id="terminal"></div>
    </div>

    <script>
    const term = new Terminal({
        cols: 120,
        rows: 35,
    theme: {
        background: '#300a24',
        foreground: '#eeeeec',
        cursor: '#bbbbbb',
        selectionBackground: '#b4d5ff',
        selectionForeground: '#300a24',
        black: '#2e3436',
        red: '#cc0000',
        green: '#4e9a06',
        yellow: '#c4a000',
        blue: '#3465a4',
        magenta: '#75507b',
        cyan: '#06989a',
        white: '#d3d7cf',
        brightBlack: '#555753',
        brightRed: '#ef2929',
        brightGreen: '#8ae234',
        brightYellow: '#fce94f',
        brightBlue: '#729fcf',
        brightMagenta: '#ad7fa8',
        brightCyan: '#34e2e2',
        brightWhite: '#eeeeec'
    }
    });
    const terminalContainer = document.getElementById('terminal');
    term.open(terminalContainer);

    let command = '';
    let currentPrompt = 'user@terminal:/home/user$ ';

    function writeTerminalOutput(text) {
        if (!text) {
            return;
        }
        const normalized = text.replace(/\r?\n/g, '\r\n');
        term.write(normalized);
    }

    // Initialize terminal and show neofetch-style system info
    term.write('\r\n');

    // Detect browser and version
    const ua = navigator.userAgent || '';
    let browserName = 'Unknown';
    let browserVersion = '';
    const m = ua.match(/(Firefox|Chrome|Edg|Safari)\/(\d+(?:\.\d+)*)/i);
    if (m) {
        browserName = m[1];
        browserVersion = m[2];
        if (browserName === 'Edg') browserName = 'Edge';
    } else if (/Safari/i.test(ua) && /Version\/(\d+(?:\.\d+)*)/i.test(ua)) {
        browserName = 'Safari';
        const mv = ua.match(/Version\/(\d+(?:\.\d+)*)/i);
        if (mv) browserVersion = mv[1];
    }

    // ASCII art logo (simple computer design)
    const ascii = [
        "   .-.     ",
        "  (o o)    ",
        "   > <     ",
        "  /| |\\   ",
        "   / \\    "
    ];

    // System info lines (will align with ASCII on the right)
    const hostname = 'user@portfolio';
    const separator = '-'.repeat(hostname.length);
    const sysInfo = [
        `${hostname}`,
        separator,
        `Browser: ${browserName} ${browserVersion}`,
        `Platform: ${navigator.platform || 'unknown'}`,
        `Language: ${navigator.language || 'en-US'}`,
        `Resolution: ${window.innerWidth}x${window.innerHeight}`,
        `Terminal: xterm.js`,
        `Uptime: Always on`,
    ];

    // Combine ASCII art and system info side-by-side
    const maxLines = Math.max(ascii.length, sysInfo.length);
    for (let i = 0; i < maxLines; i++) {
        const asciiLine = (ascii[i] || '            ').padEnd(12);
        const infoLine = sysInfo[i] || '';
        term.write(asciiLine + infoLine + '\r\n');
    }

    term.write('\r\n');

    // Color palette display
    const colors = [
        '#000000', '#dd0000', '#00dd00', '#dddd00',
        '#0000dd', '#dd00dd', '#00dddd', '#cccccc'
    ];
    const colorLine = colors.map(c => `\x1b[48;2;${parseInt(c.slice(1,3),16)};${parseInt(c.slice(3,5),16)};${parseInt(c.slice(5,7),16)}m  \x1b[0m`).join('');
    term.write(colorLine + '\r\n');

    term.write('\r\nType "help" for available commands\r\n\r\n');
    term.write(currentPrompt);

    term.onData(e => {
        if (e === '\r') {
            // Enter key
            term.write('\r\n');
            if (command.trim()) {
                handleCommand(command.trim());
            } else {
                term.write(currentPrompt);
            }
            command = '';
        } else if (e === '\x7F') {
            // Backspace
            if (command.length > 0) {
                term.write('\b \b');
                command = command.slice(0, -1);
            }
        } else if (e === '\x03') {
            // Ctrl+C
            term.write('^C\r\n');
            term.write(currentPrompt);
            command = '';
        } else if (e === '\x04') {
            // Ctrl+D - logout (easter egg)
            term.write('\r\nexit\r\n');
            term.write('Goodbye!\r\n');
        } else if (e >= String.fromCharCode(32) && e <= String.fromCharCode(126)) {
            // Printable characters
            term.write(e);
            command += e;
        } else if (e === '\t') {
            // Tab - simple autocomplete hint
            term.write('   ');
            command += '   ';
        }
    });

    function handleCommand(input) {
        // Send command to backend
        fetch('/api/execute', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ command: input })
        })
        .then(response => response.json())
        .then(data => {
            const output = data.output;
            const prompt = data.prompt;
            currentPrompt = prompt;

            // Handle special commands
            if (output === '[CLEAR]') {
                term.clear();
                term.write(currentPrompt);
            } else {
                // Display output
                if (output) {
                    writeTerminalOutput(output);
                    term.write('\r\n');
                }
                term.write(currentPrompt);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            term.write('Error executing command\r\n');
            term.write(currentPrompt);
        });
    }
    </script>
</body>
</html>
