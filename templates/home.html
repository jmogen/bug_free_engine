    function writeTerminalOutput(text) {
        if (!text) {
            return;
        }
        const normalized = text.replace(/\r?\n/g, '\r\n');
        term.write(normalized);
    }

    // Initialize terminal and show neofetch-style system info
    term.write('\r\n');

    function detectBrowser() {
        const ua = navigator.userAgent || '';

        if (/Edg\//i.test(ua)) {
            const match = ua.match(/Edg\/(\d+(?:\.\d+)*)/i);
            return {
                key: 'edge',
                name: 'Edge',
                version: match ? match[1] : '',
            };
        }

        if (/Firefox\//i.test(ua)) {
            const match = ua.match(/Firefox\/(\d+(?:\.\d+)*)/i);
            return {
                key: 'firefox',
                name: 'Firefox',
                version: match ? match[1] : '',
            };
        }

        if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) {
            const match = ua.match(/Chrome\/(\d+(?:\.\d+)*)/i);
            return {
                key: 'chrome',
                name: 'Chrome',
                version: match ? match[1] : '',
            };
        }

        if (/Safari\//i.test(ua) && /Version\//i.test(ua)) {
            const match = ua.match(/Version\/(\d+(?:\.\d+)*)/i);
            return {
                key: 'safari',
                name: 'Safari',
                version: match ? match[1] : '',
            };
        }

        return {
            key: 'generic',
            name: 'Unknown',
            version: '',
        };
    }
