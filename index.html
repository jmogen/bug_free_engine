<body>
    <div class="terminal-container">
        <div id="terminal"></div>
    </div>
    <script>

        description: 'Group capstone project that takes a natural language text prompt, generates sheet music using a locally-run transformer model, and physically plays it on a ukulele in under 45 seconds. The hardware uses four SG90 servo motors for strumming and eight linear solenoids for fretting, all mounted on custom 3D-printed housings and controlled via an Arduino over serial. The software layer is a Python REST API that parses AI-generated ABC notation into hardware commands using music21, with a Flutter frontend for mobile input. My contribution was the hardware assembly and system integration, coordinating the software and hardware subsystems into a working prototype.',

        'Highway Path Planning for Autonomous Vehicle': {

    function slugify(name) {
        return name
            .replace(/[^\w\s-]/g, '')
            .trim()
            .replace(/\s+/g, '_')
            .toLowerCase();
    }

    const PROJECT_FILES = {};
    for (const [name, data] of Object.entries(PROJECTS)) {
        PROJECT_FILES[`${slugify(name)}.txt`] = data;
    }

    const DIRECTORY_FILES = {
        '/': {},
        '/home': {},
        '/home/user': {
            'README.md': "# Welcome to My Portfolio\n\nThis is my personal portfolio website.\nExplore the projects and skills!",
            'minesweeper': '__BINARY__',
        },
        '/home/user/projects': PROJECT_FILES,
    };

    const DIRECTORY_SUBDIRS = {
        '/': ['home'],
        '/home': ['user'],
        '/home/user': ['projects'],
        '/home/user/projects': [],
    };

    const terminalState = {
        currentDir: '/home/user',
        loggedIn: 'user',
    };

    function getPromptPath() {
        if (terminalState.currentDir === '/home/user') return '~';
        if (terminalState.currentDir.startsWith('/home/user/')) {
            return terminalState.currentDir.replace('/home/user', '~');
        }
        return terminalState.currentDir;
    }

    function getPromptRaw() {
        return `${terminalState.loggedIn}@terminal:${getPromptPath()}$ `;
    }

    function cmdHelp() {
        return `Available commands:
  about        - Learn about me
  ls           - List directory contents
  tree         - Display directory tree
  pwd          - Print working directory
  whoami       - Display current user
  echo [text]  - Echo text
  cat [file]   - Display file contents
  cd [path]    - Change directory
  uname        - System information
  date         - Current date and time
  wc [file]    - Word, line, and character count of a file
  clear        - Clear terminal
  help         - Show this message
  

  (Try: mkdir, sudo for some fun!)`;
    }

    function cmdTree(args) {
        const showHidden = args.includes('-a');
        const startDir = terminalState.currentDir;
        const lines = [];
        let dirCount = 0, fileCount = 0;
        const dirColorTag = d => `\x1b[1m${colorText(d, dirColor)}\x1b[0m`;

        function isHidden(name) {
            return name.startsWith('.');
        }

        function renderDir(path, prefix) {
            const subdirNames = (DIRECTORY_SUBDIRS[path] || [])
                .filter(name => showHidden || !isHidden(name));
            const fileNames = Object.keys(DIRECTORY_FILES[path] || {})
                .filter(name => showHidden || !isHidden(name));

            const childDirs = subdirNames.map(name => ({ type: 'dir', name, fullPath: `${path}/${name}` }));
            const childFiles = fileNames.map(name => ({ type: 'file', name }));
            const children = [...childDirs, ...childFiles];

            children.forEach((child, i) => {
                const isLast = i === children.length - 1;
                const branch = isLast ? '└── ' : '├── ';
                const nextPrefix = prefix + (isLast ? '    ' : '│   ');

                if (child.type === 'dir') {
                    dirCount++;
                    lines.push(prefix + branch + dirColorTag(child.name));
                    renderDir(child.fullPath, nextPrefix);
                } else {
                    fileCount++;
                    const data = DIRECTORY_FILES[path][child.name];
                    const label = data === '__BINARY__'
                        ? `\x1b[1m${colorText(child.name, THEME.green)}\x1b[0m`
                        : child.name;
                    lines.push(prefix + branch + label);
                }
            });
        }

        lines.push(dirColorTag(startDir));
        renderDir(startDir, '');
        lines.push('');
        lines.push(`${dirCount} director${dirCount === 1 ? 'y' : 'ies'}, ${fileCount} file${fileCount === 1 ? '' : 's'}`);

        return lines.join('\r\n');
    }

    function cmdAbout() {
        const aboutHeaderLabel = colorText('About Me:', THEME.blue);
        const aboutHeader = `\x1b[1m${aboutHeaderLabel}\x1b[0m`;
        const readme = getReadmeContent();

        const projectsHeaderLabel = colorText('Projects:', THEME.blue);
        const projectsHeader = `\r\n\x1b[1m${projectsHeaderLabel}\x1b[0m`;

        terminalState.currentDir = '/home/user/projects';

        const projectSlugs = Object.keys(PROJECT_FILES);
        const projectListing = formatColumns(projectSlugs, term.cols);

        const hint = colorText(
            "\r\nType \"cat <project-name>\" to read more about any project. I recommend scrolling to the top to get started. \r\n\r\n Example: \"cat ai-powered_robotic_ukulele.txt\"",
            valueColor
        );

        const tip = colorText(
            "\r\nTip: You can hit tab to autocomplete the project name after typing \"cat\".",
            valueColor
        );

        return [aboutHeader, readme, projectsHeader, projectListing, hint, tip].join('\r\n');
    }


    function formatColumns(entries, terminalWidth) {
        if (!entries.length) return '.';

        const plainLengths = entries.map(e => stripAnsi(e).length);
        const maxLen = Math.max(...plainLengths) + 2; // 2 spaces padding between columns
        const numCols = Math.max(1, Math.floor(terminalWidth / maxLen));
        const numRows = Math.ceil(entries.length / numCols);

        const columns = [];
        for (let col = 0; col < numCols; col++) {
            columns.push(entries.slice(col * numRows, (col + 1) * numRows));
        }

        const rows = [];
        for (let row = 0; row < numRows; row++) {
            let line = '';
            for (let col = 0; col < numCols; col++) {
                const entry = columns[col][row];
                if (entry === undefined) continue;
                const plainLen = stripAnsi(entry).length;
                const padding = ' '.repeat(maxLen - plainLen);
                line += entry + padding;
            }
            rows.push(line.trimEnd());
        }
        return rows.join('\n');
    }

    function stripAnsi(text) {
        return text.replace(/\x1b\[[0-9;]*m/g, '');
    }

    function wrapText(text, width) {
        const leadingMatch = text.match(/^ +/);
        const leadingSpaces = leadingMatch ? leadingMatch[0] : '';
        const rest = text.slice(leadingSpaces.length);

        const words = rest.split(' ');
        const lines = [];
        let currentLine = '';
        let currentVisibleLen = leadingSpaces.length;
        for (const word of words) {
            const wordVisibleLen = stripAnsi(word).length;
            const spaceLen = currentLine ? 1 : 0;
            if (currentVisibleLen + spaceLen + wordVisibleLen > width) {
                lines.push(currentLine);
                currentLine = word;
                currentVisibleLen = wordVisibleLen;
            } else {
                currentLine = currentLine ? currentLine + ' ' + word : word;
                currentVisibleLen += spaceLen + wordVisibleLen;
            }
        }
        if (currentLine) lines.push(currentLine);
        if (lines.length > 0) lines[0] = leadingSpaces + lines[0];
        return lines.join('\n');
    }


    function cmdLs(args) {
        const current = terminalState.currentDir;
        const files = Object.keys(DIRECTORY_FILES[current] || {});
        const subdirs = DIRECTORY_SUBDIRS[current] || [];

        const longFlag = args.includes('-l') || args.includes('-la') || args.includes('-al');

        if (!longFlag) {
            const coloredDirs = subdirs.map(d => `\x1b[1m${colorText(d, dirColor)}\x1b[0m`);
            const coloredFiles = files.map(f => {const data = DIRECTORY_FILES[current][f]; return data === '__BINARY__' ? `\x1b[1m${colorText(f, THEME.green)}\x1b[0m` : f;});
            const entries = [...coloredDirs, ...coloredFiles];
            return formatColumns(entries, term.cols);
        }

        const now = new Date();
        const dateStr = `${now.toLocaleString('en-US', { month: 'short' })} ${now.getDate().toString().padStart(2, ' ')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

        const dirLines = subdirs.map(d => {
            const perms = 'dr-xr-xr-x';
            const name = `\x1b[1m${colorText(d, dirColor)}\x1b[0m`;
            return `${perms}  2 user user  4096 ${dateStr} ${name}`;
        });

        const fileLines = files.map(f => {
            const data = DIRECTORY_FILES[current][f];
            const size = typeof data === 'string' ? data.length : JSON.stringify(data).length;
            const perms = data === '__BINARY__' ? '-rwxr-xr-x' : '-r--r--r--';
            const name = data === '__BINARY__'
                ? `\x1b[1m${colorText(f, THEME.green)}\x1b[0m`
                : f;
            return `${perms} 1 user user ${size.toString().padStart(5, ' ')} ${dateStr} ${name}`;
         });
        const total = subdirs.length + files.length;
        return [`total ${total}`, ...dirLines, ...fileLines].join('\r\n');
    }

    function cmdPwd() {
        return terminalState.currentDir;
    }

    function cmdWhoami() {
        return terminalState.loggedIn;
    }

    function cmdEcho(args) {
        return args.length ? args.join(' ') : '';
    }

    function cmdCat(args) {
    if (!args.length) return "Usage: cat <filename>";
        const filename = args[0];
        const current = terminalState.currentDir;

        if (current === "/home/user" && filename === "README.md") {
            return getReadmeContent();
        }

        const files = DIRECTORY_FILES[current];
        if (files[filename] === '__BINARY__') return `cat: ${filename}: Permission denied (binary file)`;
        if (!files || !(filename in files)) return `cat: ${filename}: No such file or directory`;
        const content = files[filename];
        if (current === "/home/user/projects") return { type: "project", data: content };
        return content;
}

    function cmdCd(args) {
        if (!args.length) { terminalState.currentDir = '/home/user'; return; }
        const path = args[0];

        if (path.startsWith('/')) {
            const normalized = path === '/' ? '/home/user' : path.replace(/\/+$/, '');
            if (DIRECTORY_SUBDIRS[normalized] !== undefined || DIRECTORY_FILES[normalized] !== undefined) {
                terminalState.currentDir = normalized;
                return;
            }
            return `cd: ${path}: No such file or directory`;
        }

        if (path === '..') {
            if (terminalState.currentDir === '/home') return;
            const parts = terminalState.currentDir.split('/').filter(Boolean);
            parts.pop();
            terminalState.currentDir = '/' + parts.join('/');
            return;
        }

        if (path === '.') return;

        const current = terminalState.currentDir;
        const validSubdirs = (DIRECTORY_SUBDIRS[current] || []).map(d => d.split('/').pop());

        if (validSubdirs.includes(path)) {
            terminalState.currentDir = current === '/' ? `/${path}` : `${current}/${path}`;
            return;
        }

        return `cd: ${path}: No such file or directory`;
    }

    function cmdUname() {
        return 'Linux portfolio-terminal 5.10.0 #1 SMP x86_64 GNU/Linux';
    }

    function cmdDate() {
        return new Date().toUTCString();
    }

    function cmdMkdir(args) {
        if (!args.length) return 'Usage: mkdir <directory>';
        return `Permission denied: Cannot create '${args[0]}'. This is a read-only portfolio!`;
    }

    function cmdSudo(args) {
        if (!args.length) return 'sudo: no command specified';
        return "sudo: nice try, but you don't have administrator privileges here!";
    }

    function cmdClear() {
        return '[CLEAR]';
    }

    function cmdWc(args) {
        if (!args.length) return 'Usage: wc <filename>';

        const filename = args[0];
        const current = terminalState.currentDir;
        const files = DIRECTORY_FILES[current];

        if (!files || !(filename in files)) {
            return `wc: ${filename}: No such file or directory`;
        }

        const raw = files[filename];

        let text;
        if (current === '/home/user/projects') {
            text = renderProject(raw);
        } else {
            text = raw;
        }

        const lines = text.split('\n').length;
        const words = text.trim().split(/\s+/).filter(Boolean).length;
        const chars = text.length;

        return `  ${lines}  ${words}  ${chars} ${filename}`;
    }

    function cmdChmod(args) {
        if (!args.length) return 'chmod: missing operand';
        return `chmod: changing permissions of '${args[args.length - 1]}', you don't have permission!`;
    }

    function cmdTouch(args) {
        if (!args.length) return 'touch: missing file operand';

    function executeCommand(commandInput) {
        const firstWord = commandInput.trim().split(' ')[0];
        if (firstWord === 'minesweeper' || firstWord === './minesweeper') {
            startMinesweeper();
            return null;
        }
        if (!commandInput.trim()) return '';
        const parts = commandInput.trim().split(/\s+/);
        const cmd = parts[0];
        const args = parts.slice(1);

        if (cmd in COMMANDS) {
            return COMMANDS[cmd](args);
        }
        return `Command not found: ${cmd}\nType 'help' for available commands.`;

    function renderProject(data) {
        const lines = [];
        for (const [key, value] of Object.entries(data)) {
            const label = displayLabel[key] || key.charAt(0).toUpperCase() + key.slice(1);
            const hex = labelColors[key] || 'eeeeec';
            const coloredLabel = colorText(`${label}:`, hex);

            let line;
            if (key === 'website' || key === 'github') {
                line = `\x1b[1m${coloredLabel}\x1b[0m ` + colorText(value, linkColor);
            } else {
                line = `\x1b[1m${coloredLabel}\x1b[0m ${value}`;
            }
            lines.push(wrapText(line, term.cols));
        }
        return lines.join('\r\n');
    }

    function renderEntry(entry) {

        } else if (entry.type === 'project') {

            term.write('\r\n');
        } else {
            writeTerminalOutput(entry.text);
            term.write('\r\n');
        }
    }

    function detectBrowser() {
        const ua = navigator.userAgent || '';

        if (/Edg\//i.test(ua)) {
            const match = ua.match(/Edg\/(\d+(?:\.\d+)*)/i);
            return { key: 'edge', name: 'Edge', version: match ? match[1] : '' };
        }
        if (/Firefox\//i.test(ua)) {
            const match = ua.match(/Firefox\/(\d+(?:\.\d+)*)/i);
            return { key: 'firefox', name: 'Firefox', version: match ? match[1] : '' };
        }
        if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) {
            const match = ua.match(/Chrome\/(\d+(?:\.\d+)*)/i);
            return { key: 'chrome', name: 'Chrome', version: match ? match[1] : '' };
        }
        if (/Safari\//i.test(ua) && /Version\//i.test(ua)) {
            const match = ua.match(/Version\/(\d+(?:\.\d+)*)/i);
            return { key: 'safari', name: 'Safari', version: match ? match[1] : '' };
        }
        return { key: 'generic', name: 'Unknown', version: '' };
    }

    function handleTabComplete() {
        const parts = command.split(' ');
        const isFirstWord = parts.length === 1;

        const current = terminalState.currentDir;
        const files = Object.keys(DIRECTORY_FILES[current] || {});
        const dirs = (DIRECTORY_SUBDIRS[current] || []).map(d => d.replace(/\/$/, ''));
        const commandNames = Object.keys(COMMANDS);

        let candidates;
        
        if (isFirstWord) {
            const binaries = files.filter(f => DIRECTORY_FILES[current][f] === '__BINARY__');
            candidates = [...commandNames, ...binaries, ...binaries.map(b => './' + b)];
        }else {
            const cmdWord = parts[0];
            candidates = (cmdWord === 'cd') ? dirs : [...files, ...dirs];
        }

        const currentArg = parts[parts.length - 1];
        const matches = candidates.filter(c => c.startsWith(currentArg));

        if (matches.length === 1) {
            const completion = matches[0].slice(currentArg.length);
            term.write(completion);
            command += completion;
        } else if (matches.length > 1) {
            let prefix = matches[0];
            for (const m of matches) {
                let i = 0;
                while (i < prefix.length && i < m.length && prefix[i] === m[i]) i++;
                prefix = prefix.slice(0, i);
            }
            const completion = prefix.slice(currentArg.length);
            if (completion) {
                term.write(completion);
                command += completion;
            } else {
                term.write('\r\n' + matches.join('  ') + '\r\n' + currentPrompt + command);
            }
        }
    }

    const MINESWEEPER_CONFIG = { width: 9, height: 9, mines: 10 };

    const MS_NUMBER_COLORS = {
    1: '#4285f4', 2: '#34a853', 3: '#d01b24', 4: '#2075c7',
    5: '#a57705', 6: '#259185', 7: '#000000', 8: '#666666',

    let msGame = null;

    function msIndex(game, x, y) { return y * game.w + x; }
    function msInBounds(game, x, y) { return x >= 0 && x < game.w && y >= 0 && y < game.h; }

    function msNeighbors(game, x, y) {
        const coords = [];
        for (let dy = -1; dy <= 1; dy++)
            for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (msInBounds(game, nx, ny)) coords.push([nx, ny]);
            }
        return coords;
    }

    function msCreateGame() {
        const { width, height, mines } = MINESWEEPER_CONFIG;
        const grid = new Array(width * height).fill(null).map(() => ({
            mine: false, revealed: false, flagged: false, adjacent: 0,
        }));
        return { w: width, h: height, mineCount: mines, grid, cursorX: 0, cursorY: 0, started: false, over: false, won: false };
    }

    function msPlaceMines(game, safeX, safeY) {
        const safeIdx = msIndex(game, safeX, safeY);
        const safeZone = new Set([safeIdx, ...msNeighbors(game, safeX, safeY).map(([x, y]) => msIndex(game, x, y))]);
        let placed = 0;
        while (placed < game.mineCount) {
            const idx = Math.floor(Math.random() * game.grid.length);
            if (safeZone.has(idx) || game.grid[idx].mine) continue;
            game.grid[idx].mine = true;
            placed++;
        }
        for (let y = 0; y < game.h; y++)
            for (let x = 0; x < game.w; x++) {
            const cell = game.grid[msIndex(game, x, y)];
            if (cell.mine) continue;
            cell.adjacent = msNeighbors(game, x, y).filter(([nx, ny]) => game.grid[msIndex(game, nx, ny)].mine).length;
            }
        game.started = true;
    }

    function msReveal(game, x, y) {
        const cell = game.grid[msIndex(game, x, y)];
        if (cell.revealed || cell.flagged) return;
        if (!game.started) msPlaceMines(game, x, y);

        const startCell = game.grid[msIndex(game, x, y)];
        if (startCell.mine) {
            startCell.revealed = true;
            game.over = true;
            game.won = false;
            return;
        }

        const queue = [[x, y]];
        const seen = new Set([msIndex(game, x, y)]);
        while (queue.length) {
            const [cx, cy] = queue.shift();
            const c = game.grid[msIndex(game, cx, cy)];
            if (c.flagged) continue;
            c.revealed = true;
            if (c.adjacent === 0) {
            for (const [nx, ny] of msNeighbors(game, cx, cy)) {
                const nIdx = msIndex(game, nx, ny);
                if (seen.has(nIdx)) continue;
                seen.add(nIdx);
                const n = game.grid[nIdx];
                if (!n.mine && !n.flagged) queue.push([nx, ny]);
            }
            }
        }
        msCheckWin(game);
    }

    function msToggleFlag(game, x, y) {
        const cell = game.grid[msIndex(game, x, y)];
        if (cell.revealed) return;
        cell.flagged = !cell.flagged;
    }

    function msCheckWin(game) {
        if (game.grid.every(c => c.mine || c.revealed)) {
            game.over = true;
            game.won = true;
        }
    }

    function msFlagCount(game) { return game.grid.filter(c => c.flagged).length; }

    function msRenderBoard(game) {
        const lines = [];
        const flagsLeft = game.mineCount - msFlagCount(game);
        const status = game.over
            ? (game.won ? colorText('YOU WIN!', THEME.green) : colorText('BOOM! Game over.', THEME.red))
            : `Mines left: ${colorText(String(flagsLeft), THEME.yellow)}`;
        lines.push(`Minesweeper  |  ${status}`);
        lines.push(colorText('arrows/hjkl move · space/enter reveal · f flag · q quit', THEME.brightBlack));
        lines.push('');

        let header = '   ';
        for (let x = 0; x < game.w; x++) header += ' ' + (x % 10);
        lines.push(colorText(header, THEME.brightBlack));

        for (let y = 0; y < game.h; y++) {
            let row = colorText(String(y).padStart(2, ' ') + ' ', THEME.brightBlack);
            for (let x = 0; x < game.w; x++) {
            const cell = game.grid[msIndex(game, x, y)];
            const isCursor = !game.over && game.cursorX === x && game.cursorY === y;
            let glyph;
            if (game.over && cell.mine) {
                glyph = colorText('*', cell.revealed ? THEME.red : THEME.brightBlack);
            } else if (cell.flagged) {
                glyph = colorText('F', THEME.yellow);
            } else if (!cell.revealed) {
                glyph = colorText('.', THEME.brightBlack);
            } else if (cell.adjacent === 0) {
                glyph = ' ';
            } else {
                glyph = colorText(String(cell.adjacent), MS_NUMBER_COLORS[cell.adjacent] || THEME.foreground);
            }
            row += isCursor ? colorText('>', THEME.cyan) + glyph : ' ' + glyph;
            }
            lines.push(row);
        }
        return lines.join('\r\n');
    }

    function handleMinesweeperInput(e) {
        if (!msGame) return;

        if (e === 'q' || e === 'Q' || e === '\u0003') {
            exitMinesweeper(colorText('Quit minesweeper.', THEME.brightBlack));
            return;
        }

        switch (e) {
            case '\x1b[A': case 'k': msGame.cursorY = Math.max(0, msGame.cursorY - 1); break;
            case '\x1b[B': case 'j': msGame.cursorY = Math.min(msGame.h - 1, msGame.cursorY + 1); break;
            case '\x1b[C': case 'l': msGame.cursorX = Math.min(msGame.w - 1, msGame.cursorX + 1); break;
            case '\x1b[D': case 'h': msGame.cursorX = Math.max(0, msGame.cursorX - 1); break;
            case ' ': case '\r': msReveal(msGame, msGame.cursorX, msGame.cursorY); break;
            case 'f': case 'F': msToggleFlag(msGame, msGame.cursorX, msGame.cursorY); break;
            default: return; // ignore unrecognized keys
        }

        msRedraw();

        if (msGame.over) {
            exitMinesweeper(msGame.won ? colorText('You win!', THEME.green) : colorText('You hit a mine.', THEME.red));
        }
    }

        currentPrompt = colorText(getPromptRaw(), promptColor);

        if (terminalState.inGame) {
           return; // minesweeper already drew its own board; don't print anything else
        }

        if (output === '[CLEAR]') {
            outputHistory = [];
            term.clear();
            term.write(currentPrompt);
            return;
        }
       if (output && typeof output === 'object' && output.type === 'project') {
        outputHistory.push({ type: 'project', data: output.data });
        term.write(renderProject(output.data));
        term.write('\r\n\r\n'); // end output line + blank line
        } else if (output) {
            outputHistory.push({ type: 'text', text: output });
            writeTerminalOutput(output);
            term.write('\r\n\r\n'); // end output line + blank line
        } else {
            term.write('\r\n'); // just the blank line, no output line to end
        }
        term.write(currentPrompt);
    }
